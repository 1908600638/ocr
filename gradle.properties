org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The project targets API 34 while the bundled AGP is 7.3.x.
android.suppressUnsupportedCompileSdk=34

# AGP refuses Windows project paths containing non-ASCII characters. This build
# is pure Java (no NDK, no CMake), so the toolchain handles such a path fine and
# the preflight check is only noise.
android.overridePathCheck=true
